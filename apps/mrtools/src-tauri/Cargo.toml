[package]
name = "mrtools"
version = "0.1.0"
description = "Übersicht und Starter für die eigenen Apps"
authors = ["Michael Rau <dev@mraudev.com>"]
edition = "2021"

[lib]
# The `_lib` suffix avoids a name clash between the lib and the bin on Windows,
# see https://github.com/rust-lang/cargo/issues/8519
name = "mrtools_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
tauri-plugin-opener = "2"
tauri-plugin-window-state = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
reqwest = { version = "0.13", features = ["json"] }
base64 = "0.22"

[target.'cfg(windows)'.dependencies]
winreg = "0.56"
