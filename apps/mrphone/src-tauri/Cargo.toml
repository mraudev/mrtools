[package]
name = "mrphone"
version = "1.26.0"
description = "SIP-Softphone"
authors = ["Michael Rau <dev@mraudev.com>"]
repository = "https://github.com/mraudev/mrtools"
edition = "2021"

[lib]
# The `_lib` suffix avoids a name clash between the lib and the bin on Windows,
# see https://github.com/rust-lang/cargo/issues/8519
name = "mrphone_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-dialog = "2"
tauri-plugin-single-instance = "2"
serde = "1"
serde_json = "1"
base64 = "0.22"
aes-gcm = "0.10"
scrypt = { version = "0.11", default-features = false }
uuid = { version = "1", features = ["v4"] }
webview2-com = "0.39"
windows = { version = "0.62", features = ["Win32_Foundation", "Win32_Security_Cryptography", "Win32_System_SystemInformation", "Win32_System_Registry", "Win32_System_RemoteDesktop", "Win32_UI_Shell", "Win32_UI_WindowsAndMessaging", "Data_Xml_Dom", "Foundation", "UI_Notifications"] }
md-5 = "0.10"
opus = "0.3"
tokio = { version = "1", features = ["net", "rt", "time", "sync", "macros", "process", "io-util"] }
windows-core = "0.62"
