[package]
name = "mrhome"
version = "0.1.0"
description = "Licht und Heizung steuern (Hue, Govee, tado°)"
authors = ["Michael Rau <dev@mraudev.com>"]
edition = "2021"

[lib]
# The `_lib` suffix avoids a name clash between the lib and the bin on Windows,
# see https://github.com/rust-lang/cargo/issues/8519
name = "mrhome_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
tauri-plugin-updater = "2"
tauri-plugin-window-state = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
reqwest = { version = "0.13", features = ["json", "form", "query"] }
keyring-core = "1"
tokio = { version = "1", features = ["time", "macros"] }
rustls = { version = "0.23", default-features = false, features = ["std", "aws_lc_rs", "tls12"] }
sha2 = "0.10"
mdns-sd = "0.21"
if-addrs = "0.15"
socket2 = "0.6"
windows-native-keyring-store = { version = "1", default-features = false }
